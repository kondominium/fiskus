<text x="290.0" y="160.8" text-anchor="middle" font-size="15" style="fill: var(--chart-ink, #0f3d2e)">24.0 %</text>
<text x="290.0" y="302.0" text-anchor="middle" font-size="14" style="fill: var(--chart-ink, #0f3d2e)">Zone 3</text>
<rect x="376.8" y="85.1" width="74.4" height="194.9" style="fill: var(--chart-ink, #0f3d2e)"/>
<text x="414.0" y="77.1" text-anchor="middle" font-size="15" style="fill: var(--chart-ink, #0f3d2e)">42.0 %</text>
