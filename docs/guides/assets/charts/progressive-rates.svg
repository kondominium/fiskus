<text x="352.0" y="342.0" text-anchor="middle" font-size="15" style="fill: var(--chart-ink, #0f3d2e)">Progressive zone of § 32a Abs. 1 EStG</text>
<text x="104.0" y="28.0" text-anchor="start" font-size="15" style="fill: var(--chart-ink, #0f3d2e)">Marginal rate at the zone's first euro, VZ 2026</text>
