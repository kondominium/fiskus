[package]
name = "fiskus"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-only"
repository = "https://github.com/kondominium/fiskus"
readme = "docs/README.md"
description = "Einkommensteuer (German income tax) reference engine. Not official BMF software."
keywords = ["tax", "einkommensteuer", "germany", "reference"]
categories = ["finance"]
include = [
    "/src/**/*.rs",
    "/build.rs",
    "/rules/**/*.toml",
    "/Cargo.toml",
    "/docs/README.md",
    "/docs/logos/fiskus-light-mode-on-white.svg",
    "/LICENSE*",
]

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[dependencies]

[build-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.2"

[dev-dependencies]
proptest = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.2"
