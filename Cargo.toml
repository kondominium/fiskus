[package]
name = "fiskus"
version = "0.1.0-beta1"
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-only"
repository = "https://github.com/kondominium/fiskus"
readme = "docs/README.md"
description = "Einkommensteuer (German income tax) reference engine. Not official BMF software."
keywords = ["tax", "einkommensteuer", "germany", "reference"]
categories = ["finance"]
autoexamples = false
autotests = false
autobenches = false

include = [
    "/src/**/*.rs",
    "/scripts/**/*.rs",
    "/build.rs",
    "/rules/**/*.toml",
    "/Cargo.toml",
    "/docs/README.md",
    "/docs/changelog.md",
    "/docs/logos/fiskus-light-mode-on-white.svg",
    "/LICENSE*",
]

[features]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "warn"
unused_qualifications = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
missing_crate_level_docs = "warn"
unescaped_backticks = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
float_arithmetic = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes_without_reason = "warn"

[dependencies]

[build-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.2"

[[example]]
name = "guide_charts"
path = "scripts/guide/charts.rs"

[[example]]
name = "conformance_points"
path = "scripts/conformance/points.rs"

[[test]]
name = "guide_checks"
path = "scripts/guide/checks.rs"

[[test]]
name = "conformance"
path = "scripts/conformance/main.rs"

[[test]]
name = "public_api"
path = "scripts/tests/public_api.rs"

[[bench]]
name = "tariff"
path = "scripts/bench/tariff.rs"
harness = false
