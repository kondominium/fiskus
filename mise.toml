[tools]
rust = { version = "1.100.0", components = "rustfmt,clippy,llvm-tools" }
mdbook = "0.5.3"
"cargo:mdbook-katex" = "0.10.0"
"cargo:kani-verifier" = "0.68.0"
"cargo:cargo-llvm-cov" = "0.9.2"

[env]
COVERAGE_IGNORE_REGEX = '(scripts/|build\.rs)'

[tasks.build]
description = "Build the library, examples, tests and benches"
run = "cargo build --all-targets"

[tasks.lint]
description = "rustfmt check and clippy with warnings denied"
run = [
  "cargo fmt --all -- --check",
  "cargo clippy --all-targets -- -D warnings",
]

[tasks.test-unit]
description = "Unit and property tests in src/"
run = "cargo test --lib"

[tasks.test-doc]
description = "Doc tests on public items"
run = "cargo test --doc"

[tasks.test-api]
description = "Black-box tests of the public API in tests/public_api.rs"
run = "cargo test --test public_api"

[tasks.test-guide]
description = "Guide checks (tests/guide_checks) and the chart drift check"
run = [
  "cargo test --test guide_checks",
  "cargo run --example guide_charts -- --check",
]

[tasks.test-proofs]
description = "Kani proof harnesses in src/"
run = [
  "cargo kani setup",
  "cargo kani",
]

[tasks.test-all]
description = "Every test category, except coverage"
run = [
  "mise run test-unit",
  "mise run test-doc",
  "mise run test-api",
  "mise run test-guide",
  "mise run test-proofs",
]

[tasks.test-coverage]
description = "Line coverage, fails below COVERAGE_MIN_LINES (default 90; writes target/llvm-cov/lcov.info)"
run = [
  "mkdir -p target/llvm-cov",
  "cargo llvm-cov --all-targets --no-report",
  "cargo llvm-cov report --lcov --output-path target/llvm-cov/lcov.info --ignore-filename-regex \"$COVERAGE_IGNORE_REGEX\"",
  "cargo llvm-cov report --summary-only --ignore-filename-regex \"$COVERAGE_IGNORE_REGEX\" --fail-under-lines \"${COVERAGE_MIN_LINES:-90}\"",
]

[tasks.gates]
description = "Every gate CI runs: lint, test-all, test-coverage, docs"
run = [
  "mise run lint",
  "mise run test-all",
  "mise run test-coverage",
  "mise run docs",
]

[tasks.bench]
description = "Criterion benchmarks in benches/ (writes target/criterion). Measures, does not gate"
run = "cargo bench"

[tasks.docs]
description = "Build the docs book into target/book, from a clean output directory"
run = [
  "rm -rf target/book",
  "mdbook build",
]

[tasks.docs-serve]
description = "Serve the docs book locally with live reload"
run = "mdbook serve --open"

[tasks.docs-clean]
description = "Remove the docs book (target/book) and leftover calculator builds in docs/calculator, which are not on main"
run = [
  "rm -rf target/book",
  "rm -rf docs/calculator",
]

[tasks.charts]
description = "Regenerate the guide charts in docs/guide/assets/charts"
run = "cargo run --example guide_charts"

[tasks.run-example-basic-allowance]
description = "Run examples/basic_allowance.rs"
run = "cargo run --example basic_allowance"
