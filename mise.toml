[tools]
rust = { version = "1.100.0", components = "rustfmt,clippy,llvm-tools" }
mdbook = "0.5.3"
"cargo:mdbook-katex" = "0.10.0"
"cargo:kani-verifier" = "0.68.0"
"cargo:cargo-llvm-cov" = "0.9.2"
"cargo:htmlq" = "0.4.0"
"cargo:cargo-deny" = "0.22.1"
"cargo:cargo-semver-checks" = "0.44.0"

[env]
COVERAGE_IGNORE_REGEX = '(scripts/|build\.rs)'

[tasks.build]
description = "Build the library, examples, tests and benches"
run = "cargo build --all-targets"

[tasks.lint]
description = "rustfmt, clippy and rustdoc with warnings denied, and cargo-deny"
run = [
  "cargo fmt --all -- --check",
  "cargo clippy --all-targets --all-features -- -D warnings",
  "RUSTDOCFLAGS=\"-D warnings\" cargo doc --no-deps --all-features",
  "cargo deny check",
]

[tasks.test-unit]
description = "Unit and property tests in src/"
run = "cargo test --lib"

[tasks.test-doc]
description = "Doc tests on public items"
run = "cargo test --doc"

[tasks.test-api]
description = "Black-box tests of the public API in scripts/tests/public_api.rs"
run = "cargo test --test public_api"

[tasks.test-proofs]
description = "Kani proof harnesses in src/"
run = [
  "cargo kani setup",
  "cargo kani",
]

[tasks.test-all]
description = "Every test category, except coverage"
run = [
  "mise run test-unit",
  "mise run test-doc",
  "mise run test-api",
  "mise run test-conformance",
  "cargo test --test guide_checks",
  "cargo run --example guide_charts -- --check",
  "mise run test-proofs",
]

[tasks.test-coverage]
description = "Line coverage, fails below COVERAGE_MIN_LINES (default 90; writes target/llvm-cov/lcov.info)"
run = [
  "mkdir -p target/llvm-cov",
  "cargo llvm-cov --all-targets --no-report",
  "cargo llvm-cov report --lcov --output-path target/llvm-cov/lcov.info --ignore-filename-regex \"$COVERAGE_IGNORE_REGEX\"",
  "cargo llvm-cov report --summary-only --ignore-filename-regex \"$COVERAGE_IGNORE_REGEX\" --fail-under-lines \"${COVERAGE_MIN_LINES:-90}\"",
]

[tasks.gates]
description = "Every gate CI runs: lint, test-all, test-coverage, docs, package-check"
run = [
  "mise run lint",
  "mise run test-all",
  "mise run test-coverage",
  "mise run docs",
  "mise run package-check",
]

[tasks.bench]
description = "Criterion benchmarks in benches/ (writes target/criterion). Measures, does not gate"
run = "cargo bench"

[tasks.docs]
description = "Build the docs book into target/book, from a clean output directory"
run = [
  "rm -rf target/book",
  "mdbook build",
]

[tasks.docs-serve]
description = "Serve the docs book locally with live reload"
run = "mdbook serve --open"

[tasks.docs-clean]
description = "Remove the docs book (target/book)"
run = "rm -rf target/book"

[tasks.charts]
description = "Regenerate the guide charts in docs/guide/assets/charts and the tariff tables in docs/formulas"
run = "cargo run --example guide_charts"

[tasks.run-example-income-tax]
description = "Run examples/income_tax.rs"
run = "cargo run --example income_tax"

[tasks.run-example-explain-tax]
description = "Run examples/explain_tax.rs"
run = "cargo run --example explain_tax"

[tasks.test-conformance]
description = "Conformance tests and scoreboard (scripts/conformance). Year options via CONFORMANCE_YEARS, default all"
run = "cargo test --test conformance -- --nocapture"

[tasks.conformance-cases]
description = "Fetch BMF results for generated cases: YEAR=2026 KIND=kinks|samples COUNT=50, DRY_RUN=1 to probe without writing"
run = "mkdir -p target/conformance && cargo run -q --example conformance_points -- \"$YEAR\" \"$KIND\" \"${COUNT:-50}\" > target/conformance/cases.csv && scripts/conformance/fetch.sh ${DRY_RUN:+--dry-run} < target/conformance/cases.csv"

[tasks.package-check]
description = "Check the packaged crate: cargo publish --dry-run, size under 200 KB, no forbidden paths"
run = [
  "cargo publish --dry-run --allow-dirty",
  "test \"$(stat -f%z target/package/fiskus-*.crate)\" -lt 204800",
  "! cargo package --list --allow-dirty | grep -E '^(tests/|benches/|examples/|docs/references/|fixtures/)'",
]
