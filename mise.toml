[tools]
rust = { version = "1.100.0", components = "rustfmt,clippy" }
mdbook = "0.5.3"
"cargo:mdbook-katex" = "0.10.0"
"cargo:kani-verifier" = "0.68.0"

[tasks.check]
description = "fmt, clippy (deny warnings), all tests, doc tests, guide chart check"
run = [
  "cargo fmt --all -- --check",
  "cargo clippy --all-targets -- -D warnings",
  "cargo test --all-targets",
  "cargo test --doc",
  "cargo run --example guide_charts -- --check",
]

[tasks.test]
description = "Unit and property tests in src/"
run = "cargo test --lib"

[tasks.charts]
description = "Regenerate the guide charts in docs/guide/assets/charts"
run = "cargo run --example guide_charts"

[tasks.build]
description = "Build the library, examples and tests"
run = "cargo build --all-targets"

[tasks.run-example-basic_allowance]
description = "Run examples/basic_allowance.rs"
run = "cargo run --example basic_allowance"

[tasks.run-example-guide_charts]
description = "Run scripts/guide/charts.rs (writes the SVG charts)"
run = "cargo run --example guide_charts"

[tasks.verify]
description = "Kani proof harnesses"
run = [
  "cargo kani setup",
  "cargo kani",
]

[tasks.docs]
description = "Build the docs book into target/book"
run = "mdbook build"

[tasks.docs-serve]
description = "Serve the docs book locally with live reload"
run = "mdbook serve --open"
